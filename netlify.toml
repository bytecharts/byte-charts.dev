[build]
	command = "pnpm run build"
	publish = "build"

[build.environment]
	NODE_VERSION = "24"

[[headers]]
	for = "/images/charts/gallery/gallery.json"
	[headers.values]
		Cache-Control = "public, max-age=3600"

[[headers]]
	for = "/videos/videos.json"
	[headers.values]
		Cache-Control = "public, max-age=3600"

[[headers]]
	for = "/images/*"
	[headers.values]
		Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
	for = "/videos/*"
	[headers.values]
		Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
	for = "/sitemap.xml"
	[headers.values]
		Cache-Control = "public, max-age=3600"

[[headers]]
	for = "/robots.txt"
	[headers.values]
		Cache-Control = "public, max-age=0, must-revalidate"
